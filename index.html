// 真實地形：AWS Terrarium 高程圖磚 + Esri 衛星影像（可改成內政部 NLSC：https://wmts.nlsc.gov.tw/wmts/PHOTO2/default/GoogleMapsCompatible/{z}/{y}/{x}）
const DEMU=(z,x,y)=>'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/'+z+'/'+x+'/'+y+'.png';
const loadImg=u=>new Promise((ok,no)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>ok(i);i.onerror=no;i.src=u});
const wpx=(la,lo,z)=>{const n=256*2**z,s=Math.sin(la*Math.PI/180);return[(lo+180)/360*n,(.5-Math.log((1+s)/(1-s))/(4*Math.PI))*n]};
const SRC={nlsc:{n:'內政部國土測繪中心',u:(z,x,y)=>'https://wmts.nlsc.gov.tw/wmts/PHOTO2/default/GoogleMapsCompatible/'+z+'/'+y+'/'+x,c:'影像：內政部國土測繪中心'},
 esri:{n:'Esri',u:(z,x,y)=>'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/'+z+'/'+y+'/'+x,c:'影像：Esri World Imagery'}};

const pool=async(items,n,fn)=>{const q=[...items];await Promise.all(Array.from({length:n},async()=>{while(q.length)await fn(q.shift())}))};
async function loadTex(d){const{z,t0,jobs,W,Hh}=d.geo,S=SRC[srcKey],k=z<16?1:0,m=2**k,Z=z+k,ic=document.createElement('canvas');ic.width=W*m;ic.height=Hh*m;const ig=ic.getContext('2d');ig.fillStyle='#d9d4c3';ig.fillRect(0,0,ic.width,ic.height);
 const L=[];jobs.forEach(([a,b])=>{for(let i=0;i<m;i++)for(let j=0;j<m;j++)L.push([(t0[0]+a)*m+i,(t0[1]+b)*m+j,(a*m+i)*256,(b*m+j)*256])});

 let ok=0;const miss=[];
 await pool(L,8,async([x,y,px,py])=>{const im=await get(Z,x,y);if(im){ig.drawImage(im,px,py);ok++}else miss.push([x,y,px,py])});
 await pool(miss,4,async([x,y,px,py])=>{const im=await get(Z-1,x>>1,y>>1);if(im){ig.drawImage(im,(x&1)*128,(y&1)*128,128,128,px,py,256,256);ok++}});

async function real(d){
 const Rm=R/d.u,dy=Rm/d.ky,dx=Rm/d.kx;let z=14,t0,t1;
 for(;z>6;z--){const a=wpx(d.clat+dy,d.clon-dx,z),b=wpx(d.clat-dy,d.clon+dx,z);t0=[a[0]/256|0,a[1]/256|0];t1=[b[0]/256|0,b[1]/256|0];if((t1[0]-t0[0]+1)*(t1[1]-t0[1]+1)<=25)break}

 tc.canvas.width=tc.canvas.height=256;
 jobs.forEach(([a,b],n)=>{tc.drawImage(imgs[n],0,0);const q=tc.getImageData(0,0,256,256).data;for(let p=0;p<65536;p++)el[(b*256+(p>>8))*W+a*256+(p&255)]=q[p*4]*256+q[p*4+1]+q[p*4+2]/256-32768});
 d.geo={z,t0,jobs,W,Hh};await loadTex(d);
 const smp=(x,zz)=>{const[p,q]=wpx(d.clat-zz/d.u/d.ky,d.clon+x/d.u/d.kx,z),X=Math.min(W-1.01,Math.max(0,p-ox)),Y=Math.min(Hh-1.01,Math.max(0,q-oy)),i=X|0,j=Y|0,fx=X-i,fy=Y-j,g=(s,t)=>el[(j+t)*W+i+s];
  return[(g(0,0)*(1-fx)+g(1,0)*fx)*(1-fy)+(g(0,1)*(1-fx)+g(1,1)*fx)*fy,X/W,1-Y/Hh]};
 const raw=[],uv=[];for(let i=0;i<=NR;i++)for(let j=0;j<=NS;j++){const th=2*Math.PI*j/NS,r=R*i/NR,s=smp(r*Math.cos(th),r*Math.sin(th));raw.push(s[0]);uv.push(s[1],s[2])}
 const hmn=raw.reduce((a,b)=>Math.min(a,b)),hmx=raw.reduce((a,b)=>Math.max(a,b)),rel=Math.max(20,hmx-hmn);
 d.H=raw.map(h=>h-hmn);d.rel=rel;d.uv=uv;d.RH=d.X.map((x,i)=>smp(x,d.Z[i])[0]-hmn+.005*rel);}
async function load(raw){let n;try{n=prep(raw)}catch(e){$('sum').textContent=typeof e==='string'?e:'無法讀取這個 GPX 檔';return}
 $('sum').textContent='下載真實地形中…';try{await real(n);n.real=1}catch(e){n.real=0}
 D=n;cur=0;play=false;$('play').textContent='▶';const end=D.T[D.N-1];

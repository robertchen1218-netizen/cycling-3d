function demo(){const a=[],n=500;let t=Date.now(),px=0,py=0,pe=150;

  if(k){const ds=Math.hypot(x-px,y-py),g=(e-pe)/ds*100;t+=ds/Math.max(2,Math.min(14,8.5-.5*g))*1000}
